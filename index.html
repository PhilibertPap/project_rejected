<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project_rejected</title>
  <meta name="theme-color" content="#0e0e0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="row between">
      <h1 class="brand" id="brand">Rejected</h1>
      <a id="settings-link" href="#settings" hidden>Settings</a>
    </header>

    <section id="auth" hidden>
      <form id="auth-form">
        <label>Username
          <input name="username" required pattern="[A-Za-z0-9_]{3,20}"
                 title="3 to 20 characters: letters, digits, _" autocomplete="username">
        </label>
        <label>Password
          <input name="password" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <div class="row">
          <button type="submit" data-action="login">Log in</button>
          <button type="submit" data-action="signup" class="secondary">Sign up</button>
        </div>
        <p id="auth-msg" class="msg"></p>
      </form>
    </section>

    <section id="pending" hidden>
      <p>Account <strong class="js-username"></strong> created.</p>
      <p class="muted">Waiting for admin approval.</p>
      <button class="js-logout secondary">Log out</button>
    </section>

    <section id="app" hidden>
      <nav id="player-nav">
        <a href="#today">Today</a>
        <a href="#cards">My cards</a>
        <a href="#journal">Journal</a>
        <a href="#feed">Feed</a>
      </nav>
      <nav id="admin-nav">
        <a href="#admin">Users</a>
      </nav>
      <p id="stats" class="stats"></p>

      <div id="view-today"></div>
      <div id="view-cards" hidden></div>
      <div id="view-journal" hidden></div>
      <div id="view-feed" hidden></div>
      <div id="view-settings" hidden></div>
      <div id="view-admin" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/game.js"></script>
  <script src="js/views/common.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/feed.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
