<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project_rejected</title>
  <meta name="theme-color" content="#0e0e0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="row between">
      <h1 class="brand" id="brand">Project Rejected</h1>
      <a id="settings-link" class="icon-link" href="#settings" aria-label="Settings" title="Settings" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </header>

    <section id="auth" class="hero" hidden>
      <div class="hero-mark" id="hero-mark"></div>
      <p class="hero-title">Collect no's.</p>
      <p class="hero-sub">One small ask a day. The no is the point.</p>
      <form id="auth-form" class="panel">
        <label>Username
          <input name="username" required pattern="[A-Za-z0-9_]{3,20}"
                 title="3 to 20 characters: letters, digits, _" autocomplete="username">
        </label>
        <label>Password
          <input name="password" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <div class="row">
          <button type="submit" data-action="login">Log in</button>
          <button type="submit" data-action="signup" class="secondary">Sign up</button>
        </div>
        <p id="auth-msg" class="msg"></p>
      </form>
    </section>

    <section id="pending" class="hero" hidden>
      <div class="panel center">
        <p>Account <strong class="js-username"></strong> created.</p>
        <p class="muted">Waiting for admin approval. Come back a bit later.</p>
        <button class="js-logout secondary">Log out</button>
      </div>
    </section>

    <section id="app" hidden>
      <nav id="player-nav">
        <a href="#today">Story</a>
        <a href="#play">Extra</a>
        <a href="#deck">Deck</a>
        <a href="#journal">Journal</a>
        <a href="#feed">Feed</a>
      </nav>
      <nav id="admin-nav">
        <a href="#admin">Users</a>
        <a href="#catalog">Cards</a>
        <a href="#feed">Feed</a>
      </nav>
      <p id="stats" class="stats"></p>

      <div id="view-today"></div>
      <div id="view-play" hidden></div>
      <div id="view-deck" hidden></div>
      <div id="view-catalog" hidden></div>
      <div id="view-journal" hidden></div>
      <div id="view-feed" hidden></div>
      <div id="view-settings" hidden></div>
      <div id="view-admin" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/game.js"></script>
  <script src="js/views/common.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/cardui.js"></script>
  <script src="js/views/play.js"></script>
  <script src="js/views/deck.js"></script>
  <script src="js/views/catalog.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/feed.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/tutorial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
