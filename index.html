<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>project_rejected</title>
  <meta name="theme-color" content="#15161f">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "night"; } catch (e) {}</script>
  <link rel="preload" href="fonts/InstrumentSans-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/ArchivoBlack-Regular.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=20261124d">
</head>
<body>
  <main class="container">
    <header class="appbar">
      <h1 class="brand" id="brand">Project Rejected</h1>
      <div class="appbar-right">
      <div id="stats" class="hud" hidden></div>
      <div id="profile-menu" class="profile-menu" hidden>
        <button id="profile-btn" class="profile-btn avatar-sm mine" aria-label="Profile" aria-haspopup="true" aria-expanded="false"></button>
        <div id="profile-pop" class="profile-pop" hidden>
          <p class="profile-name js-username"></p>
          <a href="#deck" class="js-player-only">Deck</a>
          <a href="#settings">Settings</a>
          <button class="js-logout">Log out</button>
        </div>
      </div>
      </div>
    </header>

    <section id="auth" class="hero" hidden>
      <div class="hero-mark" id="hero-mark"></div>
      <p class="hero-title">Project Rejected</p>
      <p class="hero-sub">One small real-life ask a day.</p>
      <p class="invite-banner js-invite" data-when="signup" hidden></p>
      <form id="auth-form" class="panel">
        <label>Username
          <input name="username" required pattern="[A-Za-z0-9_]{3,20}"
                 title="3 to 20 characters: letters, digits, _" autocomplete="username">
        </label>
        <label>Password
          <input name="password" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <div class="row">
          <button type="submit" data-action="login">Log in</button>
          <button type="submit" data-action="signup" class="secondary">Sign up</button>
        </div>
        <p id="auth-msg" class="msg"></p>
      </form>
    </section>

    <section id="pending" class="hero" hidden>
      <div class="panel center">
        <p>Account <strong class="js-username"></strong> created.</p>
        <p class="muted">Waiting for admin approval. Come back a bit later.</p>
        <p class="invite-banner js-invite" data-when="pending" hidden></p>
        <button class="js-logout secondary">Log out</button>
      </div>
    </section>

    <section id="app" hidden>
      <nav id="player-nav" class="tabbar" aria-label="Main"><div class="tabbar-inner">
        <a href="#today"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="3" width="13" height="18" rx="2.5"/><path d="M12 8.2l2.6 3.8-2.6 3.8-2.6-3.8z"/></svg></span>Story</a>
        <a href="#play"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg></span>Side quests</a>
        <a href="#journal"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.5 19.5h4l10.3-10.3a2.1 2.1 0 0 0-3-3L5.5 16.5z"/><path d="M14.3 7.7l3 3"/></svg></span>Journal</a>
        <a href="#team"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c0-3.2 2.5-5.6 5.5-5.6s5.5 2.4 5.5 5.6"/><circle cx="16.8" cy="9.3" r="2.5"/><path d="M16.2 14.1c2.5.2 4.3 2.4 4.3 5.4"/></svg></span>Team</a>
      </div></nav>
      <nav id="admin-nav" class="tabbar" aria-label="Admin"><div class="tabbar-inner">
        <a href="#admin"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.9 3.1-6.8 7-6.8s7 2.9 7 6.8"/></svg></span>Users</a>
        <a href="#catalog"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="6" width="11" height="15" rx="2" transform="rotate(-8 9 13.5)"/><rect x="9.5" y="3.5" width="11" height="15" rx="2"/></svg></span>Cards</a>
        <a href="#feed"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c0-3.2 2.5-5.6 5.5-5.6s5.5 2.4 5.5 5.6"/><circle cx="16.8" cy="9.3" r="2.5"/><path d="M16.2 14.1c2.5.2 4.3 2.4 4.3 5.4"/></svg></span>Teams</a>
      </div></nav>

      <div id="view-today"></div>
      <div id="view-play" hidden></div>
      <div id="view-deck" hidden></div>
      <div id="view-catalog" hidden></div>
      <div id="view-journal" hidden></div>
      <div id="view-team" hidden></div>
      <div id="view-feed" hidden></div>
      <div id="view-settings" hidden></div>
      <div id="view-admin" hidden></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20261124d"></script>
  <script src="js/dom.js?v=20261124d"></script>
  <script src="js/supabase.js?v=20261124d"></script>
  <script src="js/game.js?v=20261124d"></script>
  <script src="js/views/common.js?v=20261124d"></script>
  <script src="js/views/analytics.js?v=20261124d"></script>
  <script src="js/views/today.js?v=20261124d"></script>
  <script src="js/views/cardui.js?v=20261124d"></script>
  <script src="js/views/play.js?v=20261124d"></script>
  <script src="js/views/deck.js?v=20261124d"></script>
  <script src="js/views/catalog.js?v=20261124d"></script>
  <script src="js/views/journal.js?v=20261124d"></script>
  <script src="js/views/feed.js?v=20261124d"></script>
  <script src="js/views/team.js?v=20261124d"></script>
  <script src="js/views/settings.js?v=20261124d"></script>
  <script src="js/views/admin.js?v=20261124d"></script>
  <script src="js/views/tutorial.js?v=20261124d"></script>
  <script src="js/app.js?v=20261124d"></script>
</body>
</html>
